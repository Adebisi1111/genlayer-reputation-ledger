<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Reputation Ledger</title>
<style>
:root{--bg:#1c130c;--panel:#241810;--butter:#e8c98a;--text:#f3e7d3;--muted:#a08a6b;--green:#7bd88f;--red:#e08a7a;--line:#3a2a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}
h1{font-size:26px;margin:12px 0 6px;color:var(--butter)}
.sub{color:var(--muted);font-size:14px}
h2{color:var(--butter);font-size:18px;margin:28px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;background:#15100a;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font-size:14px}
button{margin-top:12px;background:var(--butter);color:var(--bg);border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
pre{background:#15100a;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:13px;color:var(--butter)}
.status{margin-top:10px;font-size:13px;color:var(--muted)}
.ok{color:var(--green)}.err{color:var(--red)}
.addr{font-size:13px;color:var(--butter)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
<span style="font-size:12px;text-transform:uppercase;background:var(--butter);color:var(--bg);padding:3px 10px;border-radius:999px;font-weight:700">GenLayer Project</span>
<h1>Agent Reputation Ledger</h1>
<p class="sub">Stake-weighted reputation with slashing. Connect MetaMask (Bradbury) to interact on-chain.</p>
</header>
<div style="display:flex;gap:12px;align-items:center;margin:14px 0">
<button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
<span class="addr" id="addr">Not connected</span>
</div>
<div class="note" id="netNote"></div>
<h2>Record delivery</h2>
<div class="card">
<label>Agent</label><input id="agent" placeholder="0x..." />
<label>Bounty ID</label><input id="bountyId" placeholder="bounty-1" />
<label>Evidence URL</label><input id="evidence" placeholder="https://..." />
<label>Claimed delivery</label><input id="claimed" placeholder="Delivered successfully" />
<button id="recordBtn" onclick="record()">Record delivery</button>
<div class="status" id="recordStatus"></div>
</div>
<h2>Read reputation</h2>
<div class="card">
<label>Agent</label><input id="agentRead" placeholder="0x..." />
<button onclick="read()">Get reputation</button>
<pre id="repOut">—</pre>
</div>
</div>
<script type="module" src="app.bundle.js"></script>
</body>
</html>
